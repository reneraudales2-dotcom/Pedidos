<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiosco de Pedidos</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #f4f4f4; margin: 0; padding: 20px; }
        .card { background: white; border-radius: 15px; padding: 20px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        .btn-qty { font-size: 24px; padding: 10px 20px; cursor: pointer; border-radius: 10px; border: 1px solid #ccc; }
        .btn-confirm { background: #27ae60; color: white; border: none; padding: 20px; width: 100%; font-size: 20px; border-radius: 10px; cursor: pointer; margin-top: 20px; }
        #pantalla-exito { display: none; }
        .numero-orden { font-size: 100px; color: #27ae60; margin: 10px 0; }
    </style>
</head>
<body>

<div id="pantalla-pedido" class="card">
    <h1>Menú</h1>
    <img src="https://via.placeholder.com/150" alt="Hamburguesa" style="width:100%; border-radius:10px;">
    <h2>Hamburguesa Especial</h2>
    <p>L. 150.00</p>

    <div>
        <button class="btn-qty" onclick="cambiar(-1)">-</button>
        <span id="qty" style="font-size: 30px; margin: 0 20px;">1</span>
        <button class="btn-qty" onclick="cambiar(1)">+</button>
    </div>

    <div style="margin-top: 20px;">
        <input type="checkbox" id="refresco" style="transform: scale(1.5);">
        <label for="refresco" style="font-size: 18px; margin-left: 10px;">¿Desea Refresco? (+ L. 40)</label>
    </div>

    <button class="btn-confirm" onclick="enviarPedido()">CONFIRMAR PEDIDO</button>
</div>

<div id="pantalla-exito" class="card">
    <h1>¡Pedido Enviado!</h1>
    <p>Tu número de orden es:</p>
    <div class="numero-orden" id="num-orden">--</div>
    <p>Por favor espera en la barra.</p>
</div>

<script>
    let cantidad = 1;
    function cambiar(valor) {
        cantidad = Math.max(1, cantidad + valor);
        document.getElementById('qty').innerText = cantidad;
    }

    async function enviarPedido() {
        const refresco = document.getElementById('refresco').checked ? "SI" : "NO";
        const orden = Math.floor(Math.random() * 90) + 10; // Número entre 10 y 99

        // REEMPLAZA ESTO: Pon tu URL de Google Form (acabada en /formResponse)
        const URL_FORM = "https://docs.google.com/forms/u/0/d/e/TU_ID_DE_FORMULARIO/formResponse";
        
        const formData = new FormData();
        // REEMPLAZA LOS ENTRY IDs con los que anotaste en el paso 1
        formData.append("entry.111111", "Hamburguesa Especial"); 
        formData.append("entry.222222", cantidad);
        formData.append("entry.333333", refresco);
        formData.append("entry.444444", orden);

        // Envío silencioso a Google Sheets
        fetch(URL_FORM, { method: "POST", body: formData, mode: "no-cors" });

        // Mostrar éxito
        document.getElementById('pantalla-pedido').style.display = "none";
        document.getElementById('pantalla-exito').style.display = "block";
        document.getElementById('num-orden').innerText = "#" + orden;

        // Reiniciar después de 8 segundos
        setTimeout(() => { location.reload(); }, 8000);
    }
</script>
</body>
</html>
