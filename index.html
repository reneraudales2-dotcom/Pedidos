<script>
    let cantidad = 1;
    function cambiar(valor) {
        cantidad = Math.max(1, cantidad + valor);
        document.getElementById('qty').innerText = cantidad;
    }

    async function enviarPedido() {
    // Definimos el nombre del producto para que el código no falle
    const nombreProducto = "Hamburguesa Especial"; 
    const cantidad = document.getElementById('qty').innerText;
    const refresco = document.getElementById('refresco').checked ? "SI" : "NO";
    const orden = Math.floor(Math.random() * 90) + 10; 

    // URL corregida (sin el /u/0/)
    const URL_FORM = "https://docs.google.com/forms/d/e/1_XJMvDDZEmWozeLuPPqkpL7ytOV6bg8X5iH1beyeYWE/formResponse";
    
    const formData = new FormData();
    
    // Asegúrate de que estos entry.XXXX coincidan con tu formulario
    formData.append("entry.894611180", nombreProducto); 
    formData.append("entry.2098848368", cantidad);
    formData.append("entry.157676011", refresco);
    formData.append("entry.1139720569", orden);

    // Envío silencioso
    fetch(URL_FORM, { 
        method: "POST", 
        body: formData, 
        mode: "no-cors" 
    });

    // Mostrar éxito en pantalla
    document.getElementById('pantalla-pedido').style.display = "none";
    document.getElementById('pantalla-exito').style.display = "block";
    document.getElementById('num-orden').innerText = "#" + orden;

    // Reiniciar para el próximo cliente
    setTimeout(() => { location.reload(); }, 8000);
}
</script>
